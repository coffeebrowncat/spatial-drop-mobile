name: Build unsigned iOS IPA for Sideloadly

# manual trigger only — this is a one-off personal build, not something
# that should run on every push. click "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select a compatible Xcode version
        # FIXED — the runner's DEFAULT Xcode (15.4 on macos-14) is too old;
        # this project's React Native version requires >= 16.1, which is
        # why pod install failed with "Invalid Podfile file: Please
        # upgrade XCode." macos-15 runners ship multiple Xcode versions
        # side by side — this explicitly picks the latest stable one
        # instead of whatever happens to be selected by default.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm install

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Find the Xcode scheme name
        id: scheme
        working-directory: ios
        # FIXED — the old version grabbed whatever scheme printed first
        # under "Schemes:" from `xcodebuild -list -workspace`, which on
        # this project's newer CocoaPods setup (modularized Pods with
        # multiple sub-projects like ReactNativeDependencies,
        # React-Core-prebuilt) can list a Pods scheme before the real app
        # scheme. Archiving that Pods scheme "succeeds" but produces zero
        # app content — exactly the empty-archive failure from the last
        # run. The app's scheme name always matches its own .xcodeproj
        # name, so read that directly instead of parsing the scheme list.
        run: |
          PROJECT_NAME=$(basename "$(ls -d *.xcodeproj | grep -v '^Pods\.xcodeproj$')" .xcodeproj)
          echo "found scheme: $PROJECT_NAME"
          echo "scheme=$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Archive app WITHOUT code signing
        # CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO is the whole
        # trick here — it produces a real, complete .app build with zero
        # Apple account involvement at all. Sideloadly does the actual
        # signing afterward using your own free Apple ID, on your own
        # machine, which is the part that has to happen outside of CI.
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO

      - name: Verify the archive actually contains the app
        # SKIP_INSTALL=NO is the fix above — without it, xcodebuild archive
        # "succeeds" (exit 0) but skips copying the built .app into
        # Products/Applications, producing a hollow xcarchive with nothing
        # in it. Fail loudly here instead of silently zipping an empty
        # folder like the last run did.
        run: |
          ls -la "$RUNNER_TEMP/app.xcarchive/Products/Applications/" || {
            echo "Products/Applications is missing or empty — archive did not contain a built app."
            exit 1
          }

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/app.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          echo "found app bundle: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r spatial-drop-mobile-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: spatial-drop-mobile-unsigned-ipa
          path: ${{ runner.temp }}/ipa/spatial-drop-mobile-unsigned.ipa
          retention-days: 7
