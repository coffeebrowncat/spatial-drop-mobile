name: Build unsigned iOS IPA for Sideloadly

# manual trigger only — this is a one-off personal build, not something
# that should run on every push. click "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select a compatible Xcode version
        # FIXED — the runner's DEFAULT Xcode (15.4 on macos-14) is too old;
        # this project's React Native version requires >= 16.1, which is
        # why pod install failed with "Invalid Podfile file: Please
        # upgrade XCode." macos-15 runners ship multiple Xcode versions
        # side by side — this explicitly picks the latest stable one
        # instead of whatever happens to be selected by default.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install JS dependencies
        run: npm install

      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Find the Xcode scheme name
        id: scheme
        working-directory: ios
        run: |
          SCHEME=$(xcodebuild -list -workspace *.xcworkspace | awk '/Schemes:/{getline; print; exit}' | xargs)
          echo "found scheme: $SCHEME"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Archive app WITHOUT code signing
        # CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO is the whole
        # trick here — it produces a real, complete .app build with zero
        # Apple account involvement at all. Sideloadly does the actual
        # signing afterward using your own free Apple ID, on your own
        # machine, which is the part that has to happen outside of CI.
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace *.xcworkspace \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/app.xcarchive/Products/Applications" -name "*.app" -maxdepth 1 | head -n 1)
          echo "found app bundle: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r spatial-drop-mobile-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: spatial-drop-mobile-unsigned-ipa
          path: ${{ runner.temp }}/ipa/spatial-drop-mobile-unsigned.ipa
          retention-days: 7
